# ~/.config/hypr/hyprlock.conf

# ============================================================================
# PALETTE (Graphite — neutral, low saturation)
# ============================================================================
$surface0       = rgb(26292e)
$text           = rgb(e4e6e9)
$subtext0       = rgb(9aa0a8)
$mauve          = rgb(8b93a1)
$green          = rgb(7f9f86)
$red            = rgb(b07070)
$peach          = rgb(b09a6a)

$base_alpha85       = rgba(16181acc)
$mantle_alpha60     = rgba(0f111399)
$mauve_alpha30      = rgba(8b93a14d)

# ============================================================================
# GENERAL
# ============================================================================
general {
    hide_cursor          = true
    ignore_empty_input   = true
    text_trim            = true
}

# ============================================================================
# BACKGROUND
# ============================================================================
background {
    path         = screenshot
    color        = $base_alpha85

    blur_passes  = 4
    blur_size    = 5
    noise        = 0
    contrast     = 0.9
    brightness   = 0.25
    vibrancy     = 0.15
    vibrancy_darkness = 0.0
}

# ============================================================================
# TIME (Top Section)
# ============================================================================
label {
    text         = $TIME
    color        = $text
    font_size    = 120
    font_family  = JetBrains Mono Nerd Font ExtraBold
    position     = 0, 150
    halign       = center
    valign       = center
}

# ============================================================================
# DATE (Below Time)
# ============================================================================
label {
    text         = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color        = $subtext0
    font_size    = 18
    font_family  = JetBrains Mono Nerd Font Bold
    position     = 0, 40
    halign       = center
    valign       = center
}

# ============================================================================
# USER PILL
# ============================================================================
shape {
    size         = 195, 40
    color        = $mantle_alpha60
    rounding     = -1
    border_size  = 1
    border_color = $mauve_alpha30
    rotate       = 0
    xray         = false

    position     = 0, -80
    halign       = center
    valign       = center
    zindex       = 1
}

# ============================================================================
# USER WIDGET
# ============================================================================
label {
    text         =   $USER
    color        = $mauve
    font_size    = 13
    font_family  = JetBrains Mono Nerd Font Bold

    position     = 0, -80
    halign       = center
    valign       = center
    zindex       = 5
}

# ============================================================================
# INPUT FIELD (Pill Shape)
# ============================================================================
input-field {
    size         = 320, 45
    outline_thickness = 2
    dots_size    = 0.2
    dots_spacing = 0.2
    dots_center  = true
    dots_rounding = -1

    rounding     = -1 # Pill Shape

    # Colors
    outer_color  = $mauve
    inner_color  = $surface0
    font_color   = $text

    fade_on_empty = true
    fade_timeout = 10000
    placeholder_text = <i>password... $LAYOUT</i>
    hide_input   = false

    check_color  = $green
    fail_color   = $red
    fail_text    = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $peach

    position     = 0, -150
    halign       = center
    valign       = center
}

