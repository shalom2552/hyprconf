# ~/.config/hypr/hyprlock.conf

# ============================================================================
# PALETTE (Static Catppuccin Mocha)
# ============================================================================
$base           = rgb(1e1e2e)
$mantle         = rgb(181825)
$surface0       = rgb(313244)
$text           = rgb(cdd6f4)
$subtext0       = rgb(a6adc8)
$mauve          = rgb(cba6f7)
$green          = rgb(a6e3a1)
$red            = rgb(f38ba8)
$peach          = rgb(fab387)

$base_alpha85       = rgba(1e1e2ecc)
$mantle_alpha60     = rgba(18182599)
$mauve_alpha30      = rgba(cba6f74d)

# ============================================================================
# GENERAL
# ============================================================================
general {
    hide_cursor          = true
    ignore_empty_input   = true
    text_trim            = true
}

# ============================================================================
# BACKGROUND
# ============================================================================
background {
    monitor      =
    path         = screenshot
    color        = $base_alpha85

    blur_passes  = 4
    blur_size    = 5
    noise        = 0
    contrast     = 0.9
    brightness   = 0.25
    vibrancy     = 0.15
    vibrancy_darkness = 0.0
}

# ============================================================================
# TIME (Top Section)
# ============================================================================
label {
    monitor      =
    text         = $TIME
    color        = $text
    font_size    = 120
    font_family  = JetBrains Mono Nerd Font ExtraBold
    position     = 0, 150
    halign       = center
    valign       = center
}

# ============================================================================
# DATE (Below Time)
# ============================================================================
label {
    monitor      =
    text         = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color        = $subtext0
    font_size    = 18
    font_family  = JetBrains Mono Nerd Font Bold
    position     = 0, 40
    halign       = center
    valign       = center
}

# ============================================================================
# INPUT FIELD (Pill Shape)
# ============================================================================
input-field {
    monitor      =
    size         = 320, 45
    outline_thickness = 2
    dots_size    = 0.2
    dots_spacing = 0.2
    dots_center  = true
    dots_rounding = -1

    # Pill Shape
    rounding     = -1

    # Colors
    outer_color  = $mauve
    inner_color  = $surface0
    font_color   = $text

    fade_on_empty = true
    fade_timeout = 500
    placeholder_text = <span foreground="##cad3f5"><i>password...</i></span>
    hide_input   = false

    check_color  = $green
    fail_color   = $red
    fail_text    = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $peach

    # Lifted up to make room for the bottom dock
    position     = 0, 120
    halign       = center
    valign       = bottom
}

# ============================================================================
# BOTTOM DOCK (The Pill Background)
# ============================================================================
shape {
    monitor      =
    size         = 500, 50  # Wide enough to fit both widgets
    color        = $mantle_alpha60
    rounding     = -1
    border_size  = 1
    border_color = $mauve_alpha30
    rotate       = 0
    xray         = false

    position     = 0, 40
    halign       = center
    valign       = bottom
    zindex       = 1
}

# ============================================================================
# USER WIDGET (Left side of the pill)
# ============================================================================
label {
    monitor      =
    text         =   $USER
    color        = $mauve
    font_size    = 12
    font_family  = JetBrains Mono Nerd Font Bold

    # Offset to the LEFT inside the pill
    # We use center alignment, but move X to -200
    position     = -160, 56
    halign       = center
    valign       = bottom
    zindex       = 5
}

# ============================================================================
# LAYOUT (Right side of the pill)
# ============================================================================
label {
    monitor      =
    text         = $LAYOUT
    color        = $subtext0
    font_size    = 12
    font_family  = JetBrains Mono Nerd Font Bold

    # Offset to the RIGHT inside the pill
    # We use center alignment, but move X to 140
    position     = 140, 56
    halign       = center
    valign       = bottom
    zindex       = 5
}
